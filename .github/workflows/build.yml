name: Build kernel (KernelSU-Next + SUSFS)

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: "Add KernelSU-Next"
        type: boolean
        default: true
      susfs:
        description: "Add SUSFS patches (best-effort on 4.19)"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
      - "anykernel/**"
      - "build-local.sh"

# Kernel source + toolchain (match stock: Android clang r383902 / clang 11.0.1)
env:
  KERNEL_REPO: https://github.com/oppo-source/android_kernel_oppo_mt6765
  KERNEL_BRANCH: oppo/mt6765_t_13.1_oppo_a57_a57s_a77
  # Vendor modules repo (same branch). Its top-level is vendor/. The kernel tree has
  # ~89 git symlinks (mode 120000) into the vendor modules, in TWO target classes
  # (verified by resolving the real targets and by a CI dangling-link scan):
  #   * ../../vendor/oplus/...        -> resolves to <parent-of-kernel-root>/vendor
  #   * ../../../../vnd/vendor/oplus/ -> resolves to <grandparent-of-kernel-root>/vnd/vendor
  # Both want the SAME content (this modules repo's vendor/); there is no separate "vnd"
  # repo. To make both land inside the workspace we nest the kernel at src/kernel, so:
  #   ../vendor -> $GITHUB_WORKSPACE/src/vendor  and  vnd/vendor -> $GITHUB_WORKSPACE/vnd/vendor
  # and point both at the one real modules/vendor via symlinks.
  MODULES_REPO: https://github.com/oppo-source/android_kernel_modules_oppo_mt6765
  DEFCONFIG: k65v1_64_bsp_defconfig
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b.tar.gz
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: kernel-4.19
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev make gcc libc6-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            build-essential libncurses-dev zip unzip cpio rsync python3 git curl ca-certificates

      - name: Fetch clang r383902c (stock-matching)
        run: |
          mkdir -p toolchain/clang
          curl -LSs "$CLANG_URL" -o clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain/clang
          echo "CLANG_BIN=$PWD/toolchain/clang/bin" >> "$GITHUB_ENV"
          "$PWD/toolchain/clang/bin/clang" --version | head -1 || true

      - name: Clone kernel source (shallow, nested at src/kernel)
        run: |
          mkdir -p src vnd
          git clone --depth 1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" src/kernel

      - name: Overlay vendor modules (resolve the oplus symlinks)
        run: |
          git clone --depth 1 -b "$KERNEL_BRANCH" "$MODULES_REPO" modules
          # One real copy of the vendor modules, reached from both symlink classes.
          ln -s "$GITHUB_WORKSPACE/modules/vendor" src/vendor
          ln -s "$GITHUB_WORKSPACE/modules/vendor" vnd/vendor
          # Oppo vendor drivers (e.g. the oplus charger code) carry hardcoded relative
          # includes like "../../../../../kernel-4.19/drivers/power/supply/charger_class.h":
          # the stock build root had the kernel checkout named "kernel-4.19". The quoted
          # include is resolved physically (open() follows the drivers/power/oplus symlink
          # first, then climbs ..), so the climb lands inside modules/vendor. Alias
          # "kernel-4.19" -> the kernel root at the levels those climbs can land on.
          for d in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/modules" "$GITHUB_WORKSPACE/modules/vendor"; do
            ln -sfn "$GITHUB_WORKSPACE/src/kernel" "$d/kernel-4.19"
          done
          # General guard: fail loudly on any TRULY dangling symlink before the long build.
          # Normal in-tree links (Documentation, arch dts, dt-bindings) resolve fine now the
          # tree is intact; this only trips on broken targets.
          cd src/kernel
          echo "sample oplus links:"; ls -l kernel/sched_assist drivers/base/kernelFwUpdate || true
          miss=0
          while IFS= read -r l; do
            t=$(readlink -f "$l" 2>/dev/null || true)
            if [ -z "$t" ] || [ ! -e "$t" ]; then echo "DANGLING: $l -> $(readlink "$l")"; miss=1; fi
          done < <(find . -type l)
          [ "$miss" -eq 0 ] || { echo "::error::dangling symlinks remain; vendor overlay layout is wrong"; exit 1; }
          echo "all symlinks resolve"

      - name: Add KernelSU-Next (legacy branch — supports non-GKI 4.19; kprobe hooks)
        if: ${{ github.event.inputs.ksu != 'false' }}
        working-directory: src/kernel
        run: |
          # Use the `legacy` branch, not the default `dev`. dev targets modern GKI
          # (5.10+) with an LSM/tracepoint hook model and unguarded 5.8/5.9 APIs
          # (pgtable.h, path_umount, *_nofault). legacy keeps the classic hook model and
          # version-guards those APIs (kernel_compat.c, patch_memory.c), so it builds on
          # this 4.19 tree without hand-patching. setup.sh clones the repo and checks out
          # the ref we pass.
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          echo "KSU ref: $(cd KernelSU-Next 2>/dev/null && git rev-parse --abbrev-ref HEAD 2>/dev/null; git -C KernelSU-Next describe --tags 2>/dev/null || echo n/a)"

      - name: Apply SUSFS patches (best-effort on non-GKI 4.19)
        if: ${{ github.event.inputs.susfs == 'true' }}
        run: |
          git clone --depth 1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs
          cp susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch src/kernel/ || true
          cp -r susfs/kernel_patches/fs/* src/kernel/fs/ || true
          cp -r susfs/kernel_patches/include/linux/* src/kernel/include/linux/ || true
          cd src/kernel
          # KernelSU-side SUSFS enable patch (path/name may differ on KSU-Next; non-fatal)
          if [ -f ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ] && [ -d KernelSU-Next ]; then
            cp ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU-Next/ || true
            ( cd KernelSU-Next && patch -p1 < 10_enable_susfs_for_ksu.patch ) || echo "::warning::KSU-side SUSFS patch did not apply cleanly (KSU-Next may already include SUSFS support)"
          fi
          # kernel-side SUSFS patch; keep going if hunks fail so we can see the rejects
          patch -p1 < 50_add_susfs_in_kernel-4.19.patch || echo "::warning::kernel-side SUSFS patch had failed hunks; see *.rej"
          echo "--- any .rej files:"; find . -name '*.rej' -print || true

      - name: Merge config fragment into defconfig
        run: |
          if [ "${{ github.event.inputs.susfs }}" != "true" ]; then
            echo "SUSFS off -> KSU-only config"
            cat config/ksu_only.config >> src/kernel/arch/arm64/configs/$DEFCONFIG
          else
            cat config/ksu_susfs.config >> src/kernel/arch/arm64/configs/$DEFCONFIG
          fi

      - name: Build
        working-directory: src/kernel
        run: |
          export PATH="$CLANG_BIN:$PATH"
          MAKE_ARGS="O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=aarch64-linux-gnu-ld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            LLVM_IAS=0"
          make $MAKE_ARGS "$DEFCONFIG"
          set -o pipefail
          make -j"$(nproc)" $MAKE_ARGS 2>&1 | tee "$GITHUB_WORKSPACE/build.log"; rc=${PIPESTATUS[0]}
          echo "--- outputs:"; ls -l out/arch/arm64/boot/ || true
          echo "make rc=$rc"; exit $rc

      - name: Pack AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          cp anykernel/anykernel.sh ak3/anykernel.sh
          IMG=""
          for c in Image.gz-dtb Image-dtb Image.gz Image; do
            [ -f "src/kernel/out/arch/arm64/boot/$c" ] && IMG="src/kernel/out/arch/arm64/boot/$c" && break
          done
          if [ -z "$IMG" ]; then echo "::error::no kernel image produced — build failed"; exit 1; fi
          cp "$IMG" "ak3/$(basename "$IMG")"
          ( cd ak3 && zip -r9 "../AnyKernel3-CPH2387-$(date +%Y%m%d-%H%M).zip" . -x '.git*' )
          ls -l AnyKernel3-*.zip

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            AnyKernel3-*.zip
            src/kernel/out/arch/arm64/boot/Image*
            build.log
            src/kernel/**/*.rej
          if-no-files-found: warn
