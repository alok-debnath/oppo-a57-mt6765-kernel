name: Build kernel (KernelSU-Next + SUSFS)

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: "Add KernelSU-Next"
        type: boolean
        default: true
      susfs:
        description: "Add SUSFS patches (best-effort on 4.19)"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
      - "anykernel/**"
      - "build-local.sh"

# Kernel source + toolchain (match stock: Android clang r383902 / clang 11.0.1)
env:
  KERNEL_REPO: https://github.com/oppo-source/android_kernel_oppo_mt6765
  KERNEL_BRANCH: oppo/mt6765_t_13.1_oppo_a57_a57s_a77
  # Vendor modules repo (same branch). Its top-level is vendor/. The kernel tree
  # has ~89 symlinks (git mode 120000) like kernel/sched_assist -> ../../vendor/oplus/...
  # The link kernel/<tree>/kernel/sched_assist with target ../../vendor/... resolves ONE
  # level ABOVE the kernel tree root (every link uses depth+1 '..'), so vendor/ must sit
  # as a SIBLING of the kernel clone, at $GITHUB_WORKSPACE/vendor, not inside kernel/.
  # The stock Oppo/MTK build lays the kernel and vendor repos out as siblings this way.
  MODULES_REPO: https://github.com/oppo-source/android_kernel_modules_oppo_mt6765
  DEFCONFIG: k65v1_64_bsp_defconfig
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b.tar.gz
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: kernel-4.19
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev make gcc libc6-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            build-essential libncurses-dev zip unzip cpio rsync python3 git curl ca-certificates

      - name: Fetch clang r383902c (stock-matching)
        run: |
          mkdir -p toolchain/clang
          curl -LSs "$CLANG_URL" -o clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain/clang
          echo "CLANG_BIN=$PWD/toolchain/clang/bin" >> "$GITHUB_ENV"
          "$PWD/toolchain/clang/bin/clang" --version | head -1 || true

      - name: Clone kernel source (shallow)
        run: git clone --depth 1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Overlay vendor modules (resolve the oplus symlinks)
        run: |
          git clone --depth 1 -b "$KERNEL_BRANCH" "$MODULES_REPO" modules
          # modules repo top-level is vendor/{mediatek,oplus}. Place it as a SIBLING of
          # kernel/ (at $GITHUB_WORKSPACE/vendor) because the kernel's oplus symlinks
          # resolve one level above the kernel tree root.
          cp -a modules/vendor ./vendor
          # Verify loudly: follow the exact link that failed before. If it still
          # dangles, fail here rather than deep in kconfig.
          echo "sched_assist link:"; ls -l kernel/kernel/sched_assist || true
          echo "resolves to:"; readlink -f kernel/kernel/sched_assist || true
          test -f kernel/kernel/sched_assist/Kconfig || { echo "::error::sched_assist symlink still dangling after overlay"; exit 1; }
          dangling=$(find kernel -xtype l 2>/dev/null); if [ -n "$dangling" ]; then echo "::warning::dangling symlinks remain:"; echo "$dangling" | head -80; else echo "no dangling symlinks under kernel/"; fi

      - name: Add KernelSU-Next (kprobe hooks; CONFIG_KPROBES=y in defconfig)
        if: ${{ github.event.inputs.ksu != 'false' }}
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "KSU version: $(cd KernelSU-Next 2>/dev/null && git describe --tags 2>/dev/null || echo n/a)"

      - name: Apply SUSFS patches (best-effort on non-GKI 4.19)
        if: ${{ github.event.inputs.susfs == 'true' }}
        run: |
          git clone --depth 1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs
          cp susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch kernel/ || true
          cp -r susfs/kernel_patches/fs/* kernel/fs/ || true
          cp -r susfs/kernel_patches/include/linux/* kernel/include/linux/ || true
          cd kernel
          # KernelSU-side SUSFS enable patch (path/name may differ on KSU-Next; non-fatal)
          if [ -f ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ] && [ -d KernelSU-Next ]; then
            cp ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU-Next/ || true
            ( cd KernelSU-Next && patch -p1 < 10_enable_susfs_for_ksu.patch ) || echo "::warning::KSU-side SUSFS patch did not apply cleanly (KSU-Next may already include SUSFS support)"
          fi
          # kernel-side SUSFS patch; keep going if hunks fail so we can see the rejects
          patch -p1 < 50_add_susfs_in_kernel-4.19.patch || echo "::warning::kernel-side SUSFS patch had failed hunks; see *.rej"
          echo "--- any .rej files:"; find . -name '*.rej' -print || true

      - name: Merge config fragment into defconfig
        run: |
          if [ "${{ github.event.inputs.susfs }}" != "true" ]; then
            echo "SUSFS off -> KSU-only config"
            cat config/ksu_only.config >> kernel/arch/arm64/configs/$DEFCONFIG
          else
            cat config/ksu_susfs.config >> kernel/arch/arm64/configs/$DEFCONFIG
          fi

      - name: Build
        working-directory: kernel
        run: |
          export PATH="$CLANG_BIN:$PATH"
          MAKE_ARGS="O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=aarch64-linux-gnu-ld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            LLVM_IAS=0"
          make $MAKE_ARGS "$DEFCONFIG"
          set -o pipefail
          make -j"$(nproc)" $MAKE_ARGS 2>&1 | tee "$GITHUB_WORKSPACE/build.log"; rc=${PIPESTATUS[0]}
          echo "--- outputs:"; ls -l out/arch/arm64/boot/ || true
          echo "make rc=$rc"; exit $rc

      - name: Pack AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          cp anykernel/anykernel.sh ak3/anykernel.sh
          IMG=""
          for c in Image.gz-dtb Image-dtb Image.gz Image; do
            [ -f "kernel/out/arch/arm64/boot/$c" ] && IMG="kernel/out/arch/arm64/boot/$c" && break
          done
          if [ -z "$IMG" ]; then echo "::error::no kernel image produced — build failed"; exit 1; fi
          cp "$IMG" "ak3/$(basename "$IMG")"
          ( cd ak3 && zip -r9 "../AnyKernel3-CPH2387-$(date +%Y%m%d-%H%M).zip" . -x '.git*' )
          ls -l AnyKernel3-*.zip

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            AnyKernel3-*.zip
            kernel/out/arch/arm64/boot/Image*
            build.log
            kernel/**/*.rej
          if-no-files-found: warn
